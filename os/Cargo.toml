[package]
name = "lilos"
version = "1.3.1"
authors = ["Cliff L. Biffle <code@cliffle.com>"]
description = "A tiny embedded OS based around Futures and async."
keywords = ["async", "embedded", "os"]
categories = ["embedded","no-std"]
readme = "README.mkdn"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "thumbv8m.main-none-eabihf"

[features]
default = ["mutex", "spsc", "systick"]
mutex = []
spsc = []
systick = []

[dependencies]
cfg-if.workspace = true
cortex-m = {workspace = true, features = ["cm7", "critical-section", "inline-asm"]}
cortex-m-rt.workspace = true
lilos-list.workspace = true
pin-project.workspace = true

[dependencies.portable-atomic]
version = "1.11.0"
default-features = false
features = [
    "fallback",
    "critical-section",
]

[lib]
test = false
bench = false
